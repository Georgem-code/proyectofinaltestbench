# Banco de Pruebas - Blue Pill (STM32F103C8)
#
# Telemetria y comandos por UART, MPU6050 por el driver oficial de
# Zephyr (sensor subsystem) y salidas PWM/GPIO desde el devicetree.

CONFIG_EVENTS=y                  # bus de eventos (k_event) donde duerme la FSM

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y   # recepcion de comandos por interrupcion

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y                  # driver oficial del giroscopio

CONFIG_GPIO=y
CONFIG_PWM=y

CONFIG_UART_CONSOLE=n             # USART2 queda libre para el ESP32
